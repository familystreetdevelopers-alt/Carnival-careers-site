name: One-time CC music audio import
on:
  push:
    paths:
      - '.github/workflows/cc-music-audio-import.yml'
permissions:
  contents: write
jobs:
  import:
    if: github.repository == 'familystreetdevelopers-alt/Carnival-careers-site'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Fetch eight supplied original audio masters
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p music-2026
          curl --fail --location --retry 3 --retry-delay 2 --silent --show-error --max-time 180 'https://at.adobe.com/iWpTFeVSUl4iMKUX' --output 'music-2026/who-you-want-it-to-be.mp3'
          curl --fail --location --retry 3 --retry-delay 2 --silent --show-error --max-time 180 'https://at.adobe.com/SfpdpAol1Ef4mLiq' --output 'music-2026/cold-water.mp3'
          curl --fail --location --retry 3 --retry-delay 2 --silent --show-error --max-time 180 'https://at.adobe.com/DakQ6jsXTylnr9Vo' --output 'music-2026/the-bounce-gone.mp3'
          curl --fail --location --retry 3 --retry-delay 2 --silent --show-error --max-time 180 'https://at.adobe.com/Qjni07gLopbXHYta' --output 'music-2026/john-wick.mp3'
          curl --fail --location --retry 3 --retry-delay 2 --silent --show-error --max-time 180 'https://at.adobe.com/6bsqBeyPIN2nt30p' --output 'music-2026/love-eternally.mp3'
          curl --fail --location --retry 3 --retry-delay 2 --silent --show-error --max-time 180 'https://at.adobe.com/YwnJzfSF0frKt6QZ' --output 'music-2026/pool-party-2.mp3'
          curl --fail --location --retry 3 --retry-delay 2 --silent --show-error --max-time 180 'https://at.adobe.com/vlnWyzweueiZ4ZF2' --output 'music-2026/strength-of-we-bloodline.mp3'
          curl --fail --location --retry 3 --retry-delay 2 --silent --show-error --max-time 180 'https://at.adobe.com/LDCAFNaj7drED2rC' --output 'music-2026/stuck-in-the-middle.mp3'
      - name: Verify original file checksums
        shell: bash
        run: |
          set -euo pipefail
          echo 'b9795f1946365f969e937d9a27add5b03c566fefb0eb2616686b9cb4c1e9184b  music-2026/who-you-want-it-to-be.mp3' | sha256sum -c -
          echo '475cc9696a8559ceb9600ad12c842a15b0ef41bb4fb8b00319277840d753d078  music-2026/cold-water.mp3' | sha256sum -c -
          echo '2b152bf8738a01eeec6fb6175472807743092750c1664cc361a02cb9e334ca50  music-2026/the-bounce-gone.mp3' | sha256sum -c -
          echo '6b298501da7f9e1ffe8339f97eaa1a0acf0ca98888c1b7cd23983a0134100093  music-2026/john-wick.mp3' | sha256sum -c -
          echo 'f5c5aa7aa3ad9cd001ab4b8e168fc4ab2f2c4e25b6776e6090d84e66d69544d9  music-2026/love-eternally.mp3' | sha256sum -c -
          echo '1c99c2b34032475d61106dfce78088523b6d951d32f48ca179fc55f4d4f3117e  music-2026/pool-party-2.mp3' | sha256sum -c -
          echo '44fec068219c437c836f4e273cfd41f0025ce3cadabbdaedb96e12476a6cb9ee  music-2026/strength-of-we-bloodline.mp3' | sha256sum -c -
          echo '9743b4d2914145ec54eb294cd336b8480ae595301497dbfd23f1545e6954a926  music-2026/stuck-in-the-middle.mp3' | sha256sum -c -
      - name: Commit audio masters to original GitHub repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add music-2026/*.mp3
          if git diff --cached --quiet; then
            echo 'All supplied audio files already stored'; exit 0
          fi
          git commit -m "Archive eight approved CC music masters for website playback"
          git push origin HEAD:main
