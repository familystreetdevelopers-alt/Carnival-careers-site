name: Render Watch Her Body Speak

on:
  push:
    branches:
      - video-render-watch-her-body-speak
    paths:
      - .github/workflows/render-watch-her-body-speak.yml

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      H1_URL: "https://d2jqrm6oza8nb6.cloudfront.net/datasets/fe7415b5-d8e4-437a-8b35-e06c3d55f36e.mp4?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiYmI1YWYyM2MxMjZhZGMyNyIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTU3MTY0NH0.oCRs0xWSRLnPfHSJ0IonGBYZr7pi44TfCznqfjMPMWU"
      H2_URL: "https://d2jqrm6oza8nb6.cloudfront.net/datasets/232050e1-c516-40ab-9982-6605d2e2db7c.mp4?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMzdmNGM1ZDBkNjA5MzQ3ZSIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTU1NjMwNH0.FrDGIXxPeAo7BT5tBLbFXm34xKTWt7Lq58mY-ikDKfs"
      H3_URL: "https://d2jqrm6oza8nb6.cloudfront.net/datasets/3dc11e1c-a008-402b-a894-df429e9574d3.mp4?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiYTc4MTgxY2ExMzMwZjZkNSIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTU0MDA0Mn0.qUobiRDKEB6McTc3NwLSfEzj20WtdD5dDmSzymGQ3Nc"
      H4_URL: "https://d2jqrm6oza8nb6.cloudfront.net/datasets/303daad5-a8f6-43c7-96db-cd4a55f12c95.mp4?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiZjY5MjQ4YmE2NDgyMGEyNiIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTU0MDQxMH0.P8gQVT3xOwnmzvpeWZHpkPjjooQshnHkbAeNbL7ZC-A"
      H5_URL: "https://d2jqrm6oza8nb6.cloudfront.net/datasets/887fc992-3916-4abe-823c-ae5935155cbf.mp4?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMWVlZjgwYjM5YThmNjg3ZCIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTUxMTczMX0.-_yJw_nIwYiOzH6i_wmt6uZWuH6mPUO7g71JlPa6bnU"
      H6_URL: "https://d2jqrm6oza8nb6.cloudfront.net/datasets/f3f3e6ea-bf8d-49a6-992b-54e5972828b8.mp4?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMjVlOWNlYmY1OWQ2YjIzZiIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTUwNzAwN30.KK4cq4ilTov8y55EfAP7UP8J7wqcrz2jhksvElMCSLo"
      WOMEN_URL: "https://media.descriptusercontent.com/proxy/remux?url=https%3A%2F%2Fapi.descript.com%2Fv2%2Fpublished_projects%2Fb22b4d47-4424-465b-8a0a-3c4394fed48c%2Fhls%3Fexpiration%3D1791492921814%26signature%3Ddb2776a12fcbfab5081020453bf9d850590adf67b61748355a03ab0fb1c7c5be&filename=WOMEN+MOVING+CUT.mp4&mediaCacheBucketName=production-273614-media-cache&expiration=1791489322&signature=7ce29d65382cf81e7d63f827b5eec341a7bb791783f7fdc97e62508569e42759"
      AUDIO_URL: "https://at.adobe.com/HNTtzY63iXKFAk7Y"

    steps:
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg curl

      - name: Download source media
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-delay 2 "$WOMEN_URL" -o women.mp4
          curl -fL --retry 5 --retry-delay 2 "$H1_URL" -o h1.mp4
          curl -fL --retry 5 --retry-delay 2 "$H2_URL" -o h2.mp4
          curl -fL --retry 5 --retry-delay 2 "$H3_URL" -o h3.mp4
          curl -fL --retry 5 --retry-delay 2 "$H4_URL" -o h4.mp4
          curl -fL --retry 5 --retry-delay 2 "$H5_URL" -o h5.mp4
          curl -fL --retry 5 --retry-delay 2 "$H6_URL" -o h6.mp4
          curl -fL --retry 5 --retry-delay 2 "$AUDIO_URL" -o master.mp3
          echo "Women duration:"
          ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 women.mp4
          echo "Master duration:"
          ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 master.mp3

      - name: Single-pass intercut and mastered render
        run: |
          set -euo pipefail
          ffmpeg -hide_banner -loglevel error -y             -i women.mp4             -i h1.mp4 -i h2.mp4 -i h3.mp4 -i h4.mp4 -i h5.mp4 -i h6.mp4             -i master.mp3             -filter_complex "[0:v]scale=1920:1080:force_original_aspect_ratio=increase,crop=1920:1080,fps=30,setsar=1,split=6[wa][wb][wc][wd][we][wf];[wa]trim=start=0:end=59.370000,setpts=PTS-STARTPTS[w1];[wb]trim=start=59.370000:end=103.591667,setpts=PTS-STARTPTS[w2];[wc]trim=start=103.591667:end=152.631667,setpts=PTS-STARTPTS[w3];[wd]trim=start=152.631667:end=197.645000,setpts=PTS-STARTPTS[w4];[we]trim=start=197.645000:end=235.482800,setpts=PTS-STARTPTS[w5];[wf]trim=start=235.482800:end=246.442800,setpts=PTS-STARTPTS[w6];[1:v]scale=-2:1080:flags=lanczos,pad=1920:1080:(ow-iw)/2:(oh-ih)/2:black,fps=30,setsar=1,setpts=PTS-STARTPTS[h1v];[2:v]scale=-2:1080:flags=lanczos,pad=1920:1080:(ow-iw)/2:(oh-ih)/2:black,fps=30,setsar=1,setpts=PTS-STARTPTS[h2v];[3:v]scale=-2:1080:flags=lanczos,pad=1920:1080:(ow-iw)/2:(oh-ih)/2:black,fps=30,setsar=1,setpts=PTS-STARTPTS[h3v];[4:v]scale=-2:1080:flags=lanczos,pad=1920:1080:(ow-iw)/2:(oh-ih)/2:black,fps=30,setsar=1,setpts=PTS-STARTPTS[h4v];[5:v]scale=-2:1080:flags=lanczos,pad=1920:1080:(ow-iw)/2:(oh-ih)/2:black,fps=30,setsar=1,setpts=PTS-STARTPTS[h5v];[6:v]scale=-2:1080:flags=lanczos,pad=1920:1080:(ow-iw)/2:(oh-ih)/2:black,fps=30,setsar=1,setpts=PTS-STARTPTS[h6v];[h1v][w1][h2v][w2][h3v][w3][h4v][w4][h5v][w5][h6v][w6]concat=n=12:v=1:a=0[v]"             -map "[v]" -map 7:a:0             -c:v libx264 -preset veryfast -crf 20 -pix_fmt yuv420p             -c:a aac -b:a 320k -t 306.442449 -movflags +faststart             -metadata title="Watch Her Body Speak"             WATCH_HER_BODY_SPEAK_FULL_MUSIC_VIDEO.mp4

          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name,width,height -of json WATCH_HER_BODY_SPEAK_FULL_MUSIC_VIDEO.mp4

      - name: Upload finished MP4
        uses: actions/upload-artifact@v4
        with:
          name: watch-her-body-speak-full-music-video-singlepass
          path: WATCH_HER_BODY_SPEAK_FULL_MUSIC_VIDEO.mp4
          retention-days: 1
          compression-level: 0
