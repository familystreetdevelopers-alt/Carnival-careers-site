name: Render Watch Her Body Speak Clean

on:
  push:
    branches:
      - video-render-watch-her-body-speak
    paths:
      - .github/workflows/render-watch-her-body-speak.yml

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      H1_URL: "https://d2jqrm6oza8nb6.cloudfront.net/datasets/fe7415b5-d8e4-437a-8b35-e06c3d55f36e.mp4?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiYmI1YWYyM2MxMjZhZGMyNyIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTU3MTY0NH0.oCRs0xWSRLnPfHSJ0IonGBYZr7pi44TfCznqfjMPMWU"
      H2_URL: "https://d2jqrm6oza8nb6.cloudfront.net/datasets/232050e1-c516-40ab-9982-6605d2e2db7c.mp4?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMzdmNGM1ZDBkNjA5MzQ3ZSIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTU1NjMwNH0.FrDGIXxPeAo7BT5tBLbFXm34xKTWt7Lq58mY-ikDKfs"
      H3_URL: "https://d2jqrm6oza8nb6.cloudfront.net/datasets/3dc11e1c-a008-402b-a894-df429e9574d3.mp4?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiYTc4MTgxY2ExMzMwZjZkNSIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTU0MDA0Mn0.qUobiRDKEB6McTc3NwLSfEzj20WtdD5dDmSzymGQ3Nc"
      H4_URL: "https://d2jqrm6oza8nb6.cloudfront.net/datasets/303daad5-a8f6-43c7-96db-cd4a55f12c95.mp4?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiZjY5MjQ4YmE2NDgyMGEyNiIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTU0MDQxMH0.P8gQVT3xOwnmzvpeWZHpkPjjooQshnHkbAeNbL7ZC-A"
      H5_URL: "https://d2jqrm6oza8nb6.cloudfront.net/datasets/887fc992-3916-4abe-823c-ae5935155cbf.mp4?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMWVlZjgwYjM5YThmNjg3ZCIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTUxMTczMX0.-_yJw_nIwYiOzH6i_wmt6uZWuH6mPUO7g71JlPa6bnU"
      H6_URL: "https://d2jqrm6oza8nb6.cloudfront.net/datasets/f3f3e6ea-bf8d-49a6-992b-54e5972828b8.mp4?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMjVlOWNlYmY1OWQ2YjIzZiIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTUwNzAwN30.KK4cq4ilTov8y55EfAP7UP8J7wqcrz2jhksvElMCSLo"
      AUDIO_URL: "https://at.adobe.com/HNTtzY63iXKFAk7Y"

    steps:
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg curl

      - name: Download source media
        run: |
          set -euo pipefail
          curl -fL --retry 5 "$H1_URL" -o h1.mp4
          curl -fL --retry 5 "$H2_URL" -o h2.mp4
          curl -fL --retry 5 "$H3_URL" -o h3.mp4
          curl -fL --retry 5 "$H4_URL" -o h4.mp4
          curl -fL --retry 5 "$H5_URL" -o h5.mp4
          curl -fL --retry 5 "$H6_URL" -o h6.mp4
          curl -fL --retry 5 "$AUDIO_URL" -o master.mp3
          IDS="6174518 4420415 4781571 4774634 3582892 5027957 6174390 30628323 31569925 7269178 8039276 9003383 9003396 7569779 6174439 6174391 4781569 7271354"
          n=1
          for id in $IDS; do
            curl -fL --retry 5 --retry-delay 2 "https://www.pexels.com/download/video/$id/" -o "p$n.mp4"
            n=$((n+1))
          done

      - name: Normalize moving clips
        run: |
          set -euo pipefail
          mkdir -p norm
          for i in 1 2 3 4 5 6; do
            ffmpeg -hide_banner -loglevel error -y -i "h$i.mp4" -an               -vf "scale=-2:720:flags=lanczos,pad=1280:720:(ow-iw)/2:(oh-ih)/2:black,fps=30,setsar=1,format=yuv420p"               -c:v libx264 -preset veryfast -crf 21 "norm/h$i.mp4"
          done
          for i in $(seq 1 18); do
            ffmpeg -hide_banner -loglevel error -y -i "p$i.mp4" -an               -vf "scale=1280:720:force_original_aspect_ratio=increase,crop=1280:720,fps=30,setsar=1,format=yuv420p"               -c:v libx264 -preset veryfast -crf 21 "norm/p$i.mp4"
          done

      - name: Build full moving sequence
        run: |
          set -euo pipefail
          cat > concat.txt <<'EOF'
file 'norm/h1.mp4'
file 'norm/p1.mp4'
file 'norm/p2.mp4'
file 'norm/p3.mp4'
file 'norm/h2.mp4'
file 'norm/p4.mp4'
file 'norm/p5.mp4'
file 'norm/p6.mp4'
file 'norm/h3.mp4'
file 'norm/p7.mp4'
file 'norm/p8.mp4'
file 'norm/p9.mp4'
file 'norm/h4.mp4'
file 'norm/p10.mp4'
file 'norm/p11.mp4'
file 'norm/p12.mp4'
file 'norm/h5.mp4'
file 'norm/p13.mp4'
file 'norm/p14.mp4'
file 'norm/p15.mp4'
file 'norm/h6.mp4'
file 'norm/p16.mp4'
file 'norm/p17.mp4'
file 'norm/p18.mp4'
EOF
          ffmpeg -hide_banner -loglevel error -y -f concat -safe 0 -i concat.txt             -i master.mp3 -map 0:v:0 -map 1:a:0             -c:v libx264 -preset veryfast -crf 20 -pix_fmt yuv420p             -c:a aac -b:a 320k -t 306.442449 -movflags +faststart             -metadata title="Watch Her Body Speak"             WATCH_HER_BODY_SPEAK_FULL_MUSIC_VIDEO_CLEAN.mp4
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name,width,height -of json WATCH_HER_BODY_SPEAK_FULL_MUSIC_VIDEO_CLEAN.mp4

      - name: Upload finished MP4
        uses: actions/upload-artifact@v4
        with:
          name: watch-her-body-speak-full-music-video-clean
          path: WATCH_HER_BODY_SPEAK_FULL_MUSIC_VIDEO_CLEAN.mp4
          retention-days: 1
          compression-level: 0
